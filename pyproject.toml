[project]
name = "cadbimelectri"
version = "0.1.0"
description = "Herramienta abierta para proyectos eléctricos residenciales con BIM e IA"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7,<3", "ifcopenshell>=0.8"]
export = ["fpdf2>=2.7,<3", "ifcopenshell>=0.8"]
bim = ["ifcopenshell>=0.8"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]

[tool.setuptools.packages.find]
include = ["core*", "exporters*"]
